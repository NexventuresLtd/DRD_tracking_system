version: '3.9'

# Production compose — no bind-mounts, no --reload, nginx fronts everything.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# Secrets:
#   Copy Server/.env.example → Server/.env.prod and fill in all values.

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: drd_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-drd_tracking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drd} -d ${POSTGRES_DB:-drd_tracking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: drd_redis_prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: drd_server_prod
    env_file:
      - ./Server/.env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-drd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drd_tracking}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-drd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drd_tracking}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    expose:
      - "1104"
    networks:
      - backend
      - frontend
    # No --reload in prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 1104 --workers 4

  client:
    build:
      context: ./Clients
      dockerfile: Dockerfile.prod
    container_name: drd_client_prod
    restart: always
    expose:
      - "80"
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: drd_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - server
      - client
    restart: always
    networks:
      - frontend

  reticulum:
    build:
      context: ./reticulum
      dockerfile: Dockerfile
    container_name: drd_reticulum_prod
    env_file:
      - ./reticulum/.env
    environment:
      - DRD_API_URL=http://server:1104/api/v1
    volumes:
      - reticulum_data:/data
    network_mode: host       # Reticulum needs raw access to LAN/LoRa interfaces
    restart: always
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  reticulum_data:

networks:
  backend:
    internal: true
  frontend:
