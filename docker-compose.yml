version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: drd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword
      POSTGRES_DB: dod_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dod_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: drd_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: drd_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: drd_server
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:YourStrongPassword@postgres:5432/dod_tracking
      - DATABASE_URL_SYNC=postgresql://postgres:YourStrongPassword@postgres:5432/dod_tracking
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./Server/.env
    ports:
      - "1104:1104"
    volumes:
      - ./Server:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 1104 --reload

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
